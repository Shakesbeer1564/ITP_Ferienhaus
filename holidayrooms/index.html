        </div>
      </div>
    </div>

    <div class="buttons">
      <button id="open_Login">Login</button>
      <button id="open_registration">Registration</button>
      <button id="logout">Logout</button>
    </div>
  </div>

  <div class="container-filterbar">
    <div class="heading">
      <h3>Rooms-Booking</h3>
    </div>

    <div class="filterbar">
      <!--#region place_filter -->
      <div class="filter">
        <div class="filter-title">
          <span>Place:</span>
        </div>
        <div class="result">
          <input id="region_input" class="input" type="text"/>
        </div>
      </div>
      <!--#endregion region_filter-->

      <!--#region room-count_filter -->
      <div class="filter">
        <div class="filter-title">
          <span>Room-Count:</span>
        </div>
        <div class="input_number">
          <input id="room_count" type="number" min="0" step="1" class="count input"/>
        </div>
      </div>
      <!--#endregion room-count_filter-->

      <!--#region room-count_filter -->
      <div class="filter">
        <div class="filter-title">
          <span>Bed-Count:</span>
        </div>
        <div class="input_number">
          <input id="bed_count" type="number" min="0" step="1" class="count input"/>
        </div>
      </div>
      <!--#endregion room-count_filter-->

      <!--#region date_start -->
      <div class="filter">
        <div class="filter-title">
          <span>Start-Date:</span>
        </div>
        <div class="result">
          <input id="date_start" class="input" type="date"/>
        </div>
      </div>
      <!--#endregion date_start-->

      <!--#region date_end -->
      <div class="filter">
        <div class="filter-title">
          <span>End-Date:</span>
        </div>
        <div class="result">
          <input id="date_end" class="input" type="date"/>
        </div>
      </div> 
      <!--#endregion date_end-->
    </div>
    <button id="apply_filter" class="apply-filter">Apply Filter</button>
  </div>


  <!-- Login-Dialog -->
  <div id="login_dialog" class="login-dialog">
  </div>

  <!-- Registration-Dialog -->
  <div id="reg_dialog" class="reg-dialog">
  </div>

  <div id="dark_background" class="dark-background"></div>

  <div id="holiday-rooms-container" class="holiday-rooms-container">
    <!-- Nur ein Beispiel ==> Das wird später dynamisch erzeugt -->

    <div class="filterbar">

          <span>Search:</span>

        <div class="result">

    <button id="apply_filter_ac" class="apply-filter">Apply Filter</button>
