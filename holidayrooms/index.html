    </div>
    <div class="buttons">
      <button id="open_Login">Login</button>
      <button id="open_registration">Registration</button>

  <div class="container-filterbar">
    <div class="heading">
      <h3>Rooms booking</h3>
    </div>

    <!--#region place_filter -->
    <div class="filter">
      <div class="filter-title">
        <span>Ort</span>
      </div>
      <div class="result">
        <input type="text" disabled="true" value="TestOrt"/>
        <ul id="dropdown-place" class="dropdown-container">
          <li>
            <a>Place 1</a>
          </li>
          <li>
            <a>Place 2</a>
          </li>
          <li>
            <a>Place 3</a>
          </li>
        </ul>
      </div>
      <div id="place_filter" class="arrow">
        <div class="arrow-implement">
        </div>
      </div>
    </div>
    <!--#endregion place_filter-->

    <!--#region region_filter -->
    <div class="filter">
      <div class="filter-title">
        <span>Region</span>
      </div>
      <div class="result">
        <input type="text" disabled="true" value="TestRegion"/>
        <ul id="dropdown_region" class="dropdown-container">
          <li>
            <a>Option 1</a>
          </li>
          <li>
            <a>Option 2</a>
          </li>
          <li>
            <a>Option 3</a>
          </li>
        </ul>
      </div>
      <div id="region_filter" class="arrow">
        <div class="arrow-implement">
        </div>
      </div>
    </div>
    <!--#endregion region_filter-->
  </div>


  <!-- Login-Dialog -->
  <div id="login_dialog" class="login-dialog">
  </div>

  <!-- Registration-Dialog -->
  <div id="reg_dialog" class="reg-dialog">
  </div>
