<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Ferienhausverwaltung</title>
  <link rel="stylesheet" href="./admin.css">
  <script src="admin.js" type="module"></script>
</head>

<body>
  <!-- app bar -->
  <div class="app-bar-container">
    <div class="heading-title">
      <h1>Holidayrooms - Admin</h1>
    </div>
  </div>

  <!-- Customers -->
  <div id="customer-container">
    <div class="heading-bar">
      <div class="heading">
        <h3>Customers</h3>
      </div>
    </div>
    <!-- Customer table -->
    <table id="customer-table" class="admin-page-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- Customer rows will be appended here -->
      </tbody>
    </table>
  </div>

  <!-- History -->
  <div id="history-container" class="hidden">
    <div class="heading-bar">
      <div class="heading">
        <h3>History of user: <span id="username-info"></span>
        </h3>
        <img src="../../assets/back_icon.png" width="32" height="32" id="back-icon">
      </div>
    </div>
  </div>

  <!-- Bookings -->
  <div id="booking-container" class="hidden">
    <div class="heading-bar">
      <div class="heading">
        <h3>Bookings</h3>
      </div>
    </div>
    <table id="booking-table" class="admin-page-table">
      <thead>
        <tr>
          <th>Start date</th>
          <th>End date</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <!-- Bookings will be appended here -->
      </tbody>
    </table>
  </div>

  <!-- Invoices -->
  <div id="invoice-container" class="hidden">
    <div class="heading-bar">
      <div class="heading">
        <h3>Invoices</h3>
      </div>
    </div>
    <table id="invoice-table" class="admin-page-table">
      <thead>
        <tr>
          <th>Invoice date</th>
          <th>Invoice amount</th>
        </tr>
      </thead>
      <tbody>
        <!-- Invoices will be appended here -->
      </tbody>
    </table>
  </div>


</body>

</html>
