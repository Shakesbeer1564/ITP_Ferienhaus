<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Ferienhausverwaltung</title>
  <link rel="stylesheet" href="./admin.css">
  <script src="admin.js" type="module"></script>
</head>

<body>
  <!-- app bar -->
  <div class="app-bar-container">
    <div class="heading-title">
      <h1>Holidayrooms - Admin</h1>
    </div>
  </div>

  <!-- Customers -->
  <div id="customer-container">
    <div class="heading-bar">
      <div class="heading">
        <h3>Customers</h3>
      </div>
    </div>
    <!-- Customer table -->
    <table id="customer-table" class="admin-page-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <!-- Customer rows will be appended here -->
      </tbody>
    </table>
  </div>

  <div id="booking-container" class="hidden">
    <div class="heading-bar">
      <div class="heading">
        <h3>Bookings</h3>
      </div>
    </div>
    <table id="booking-table" class="admin-page-table">
      <thead>
        <tr>
          <th>Startdatum</th>
          <th>Enddatum</th>
          <th>Preis</th>
        </tr>
      </thead>
      <tbody>
        <!-- Bookings will be appended here -->
      </tbody>
    </table>
  </div>


</body>

</html>
